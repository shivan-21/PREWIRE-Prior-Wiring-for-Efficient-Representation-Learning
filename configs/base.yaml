# Shared defaults, merged under each condition config (condition overrides base).
# Values are set from pilot runs, not fixed in advance.

pretrain:
  method:        # random | oja | lpl | simclr (set per condition; lpl_temporal uses lpl on sequences)

finetune:
  labeled_counts:  # labeled set sizes, spanning 10 to 50,000

model:
  arch: vgg11    # one shared backbone for all conditions (upstream VGG11Encoder)

data:
  dataset: cifar10

seed:
