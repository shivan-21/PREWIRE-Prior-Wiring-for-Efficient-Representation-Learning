# LPL on synthetic CIFAR-10 sequences (temporal test). Overrides base.yaml; the step budget and
# frames per step are inherited, so the temporal runs match lpl exactly in compute.
# Values marked "pilot default" are starting points. Controls override fields of this file:
# rho: 0 (smoothness control), order: shuffled, pretrain.shuffle_positives: true.

pretrain:
  method: lpl
  experiment: ablation/lpl_temporal
  shuffle_positives: false  # true = cross-clip control (removes same-image pairing)

data:
  sequence:
    clip_length: 8        # pilot default; clips per step = frames_per_step / clip_length
    rho: 0.8              # pilot default; frame-to-frame latent correlation (0 = independent views)
    frame_gap: 1          # pairs are frames this far apart
    order: temporal       # temporal | shuffled (frames of each clip randomly reordered)
